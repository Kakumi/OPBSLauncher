appId: "opbs"
productName: "One Piece - Blue Sea"
# No version in file names, so that the permanent links
# https://github.com/Kakumi/OPBSLauncher/releases/latest/download/<file>
# used on opbluesea.fr always point to the newest release.
artifactName: "One-Piece-Blue-Sea-setup.${ext}"

copyright: "Copyright © 2024-2025 Kakumi"

asar: true
compression: "maximum"

files:
  - "!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}"

extraResources:
  - "libraries"

# Windows Configuration
win:
  icon: "build/icon.ico"
  target:
    - target: "nsis"
      arch: "x64"

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
# x64 only, on purpose: Minecraft 1.12.2 uses LWJGL 2 whose macOS natives are
# x86_64-only. An arm64 launcher forces an arm64 Java (helios-core rejects x64
# JVMs on arm Macs), which cannot load them. The x64 build runs under Rosetta 2
# on Apple Silicon and downloads an x64 Java, which works.
mac:
  target:
    - target: "dmg"
      arch:
        - "x64"
  artifactName: "One-Piece-Blue-Sea-setup-${arch}.${ext}"
  category: "public.app-category.games"

# Linux Configuration
linux:
  target: "AppImage"
  maintainer: "Kakumi"
  vendor: "Kakumi"
  synopsis: "One Piece Blue Sea Minecraft Launcher"
  description: "Officiel Minecraft Launcher for One Piece Blue Sea"
  category: "Game"

directories:
  buildResources: "build"
  output: "dist"
